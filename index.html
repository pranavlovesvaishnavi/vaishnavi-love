<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Vaishnavi ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- SCREEN 1 : ENVELOPE -->
    <section id="screen1" class="screen active">

        <div class="heart heart1">❤️</div>
        <div class="heart heart2">💕</div>
        <div class="heart heart3">💗</div>
        <div class="heart heart4">💖</div>

        <div class="envelope">💌</div>

        <h1>A Letter For You ❤️</h1>

        <p>Click below to open my heart.</p>

        <button id="openBtn">Open Letter 💕</button>

    </section>


    <!-- SCREEN 2 : PROPOSAL -->
    <section id="screen2" class="screen">

        <div class="heart heart1">❤️</div>
        <div class="heart heart2">💕</div>
        <div class="heart heart3">💗</div>
        <div class="heart heart4">💖</div>

        <div class="letter-window">

            <h1>
                Please forgive me Vaishnavi,<br>
                I love you forever,<br>
                will you be my girlfriend?
            </h1>

            <!-- NO CAT GIF HERE -->
            <!-- NO THANK YOU HERE -->

            <div class="buttons">

                <button id="yesBtn">
                    YES ❤️
                </button>

                <button id="noBtn">
                    NO 💔
                </button>

            </div>

        </div>

    </section>


    <!-- SCREEN 3 : FINAL -->
    <section id="screen3" class="screen">

        <div class="heart heart1">❤️</div>
        <div class="heart heart2">💕</div>
        <div class="heart heart3">💗</div>
        <div class="heart heart4">💖</div>

        <!-- Dancing cat GIF ONLY on Screen 3 -->
        <img
            src="cat_dance.gif"
            alt="Dancing Cat"
            class="dancing-cat"
        >

        <h1>I love you so much ❤️</h1>

        <p class="final-message">
            Call? 💕
        </p>

        <!-- NO YES/NO BUTTONS HERE -->

    </section>


    <script src="script.js"></script>

</body>
</html>
